<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Codex 额度调度器 · UI 原型</title>
<style>
/* ====================================================================
   CODEX QUOTA SCHEDULER — DESIGN SYSTEM / SINGLE FILE / NO CDN
   Style reference: image design directions, canonical screenshots from this HTML.
   ==================================================================== */
:root {
  color-scheme: light;
  --bg:#f5f7fb; --surface:#ffffff; --surface-subtle:#f8fafd; --sidebar:#111d30;
  --sidebar-2:#172840; --sidebar-active:#214c8f; --sidebar-border:#2c3d56;
  --ink:#17233a; --muted:#67758e; --subtle:#8c98aa; --line:#e2e8f1;
  --primary:#2563eb; --primary-hover:#1d4ed8; --primary-wash:#eff5ff;
  --success:#12a879; --success-wash:#e5f8f0;
  --warning:#e39413; --warning-wash:#fff5e3;
  --danger:#e44b59; --danger-wash:#fff0f1;
  --neutral-wash:#eef2f7;
  --radius-sm:7px; --radius-md:11px; --radius-lg:15px;
  --shadow:0 2px 10px rgba(19,35,65,.035),0 1px 2px rgba(19,35,65,.025);
  --shadow-raised:0 10px 40px rgba(13,28,49,.12);
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px;
  --space-6:24px; --space-8:32px; --space-10:40px;
  --sidebar-w:240px; --motion:160ms ease;
}
@media (prefers-color-scheme: dark) {
  /* Reserved dark-mode tokens. Activated by [data-theme="dark"] only. */
  :root:not([data-theme]) {color-scheme:light}
}
:root[data-theme="dark"] {color-scheme:dark; --bg:#0d1422; --surface:#152034; --surface-subtle:#1b2940; --ink:#eff4ff; --muted:#a6b5ce; --subtle:#8194b3; --line:#304059; --primary-wash:#1c365d; --success-wash:#143f34; --warning-wash:#493b20; --danger-wash:#472b37; --neutral-wash:#25334b; --shadow:0 1px 3px rgba(0,0,0,.22)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);background:var(--bg);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid rgba(37,99,235,.32);outline-offset:2px}
a{color:inherit;text-decoration:none}
svg{display:block;flex:none}
code,.mono,.number{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-variant-numeric:tabular-nums}
.app-shell{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;display:flex;flex-direction:column;height:100vh;padding:23px 14px 17px;background:linear-gradient(168deg,#142239 5%,#101c2e 80%);color:#f3f7ff;z-index:5}
.brand{display:flex;gap:11px;align-items:center;padding:4px 10px 24px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand-mark{display:grid;place-items:center;width:39px;height:39px;border-radius:12px;background:#285fef;box-shadow:0 5px 18px #1a57ed40}
.brand-title{font-size:15px;font-weight:750;line-height:1.35;letter-spacing:-.15px;white-space:nowrap}
.brand-subtitle{font-size:10px;color:#93a5c0;margin-top:2px;letter-spacing:.1px}
.nav{display:grid;gap:5px;padding-top:22px}
.nav-item{display:flex;align-items:center;gap:11px;border-radius:9px;padding:11px 13px;color:#b2c0d8;font-weight:600;font-size:13px;transition:background var(--motion),color var(--motion)}
.nav-item:hover{color:#fff;background:#223752}
.nav-item[aria-current="page"]{color:#fff;background:linear-gradient(90deg,#2458a9,#214783);box-shadow:inset 3px 0 #5597ff}
.nav-item svg{opacity:.88}
.sidebar-bottom{margin-top:auto;padding:18px 5px 0;border-top:1px solid var(--sidebar-border)}
.sidebar-label{display:block;font-size:11px;color:#a5b3ca;margin:0 0 7px}
.sidebar-select,.sidebar-input{display:block;width:100%;height:37px;background:#21334b;border:1px solid #3a4e67;border-radius:8px;color:#eef5ff;padding:0 11px;outline:none;min-width:0}
.sidebar-select{margin-bottom:15px}.sidebar-input::placeholder{color:#879bb5}
.sidebar-label.secret-label{margin-bottom:6px}
.sidebar-help{display:flex;align-items:flex-start;gap:8px;font-size:10.5px;line-height:1.55;color:#a8bad3;margin:10px 0 14px}
.sidebar-help svg{margin-top:2px}
.remember{display:flex;align-items:flex-start;gap:8px;color:#d8e2f1;font-size:10.5px;line-height:1.5;cursor:pointer;margin:11px 0 14px}
.remember input{margin:2px 0 0;accent-color:#3277ff}
.sidebar-primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:39px;background:var(--primary);border:1px solid #3a75f1;border-radius:8px;color:#fff;font-weight:700;transition:background var(--motion)}
.sidebar-primary:hover{background:var(--primary-hover)}
.sidebar-running{display:flex;align-items:flex-start;gap:8px;color:#9aacc4;font-size:11px;line-height:1.65;padding:17px 2px 1px}
.sidebar-running svg{margin-top:2px}
.workspace{width:100%;min-width:0;max-width:1750px;margin:0 auto;padding:29px 34px 54px}
.page-header{display:flex;gap:18px;align-items:center;justify-content:space-between;margin-bottom:22px;min-height:53px}
.page-header h1{font-size:25px;letter-spacing:-.7px;line-height:1.3;margin:0 0 4px;font-weight:780}
.page-header p{color:var(--muted);margin:0;font-size:12.5px}
.header-status{display:flex;align-items:center;gap:9px;white-space:nowrap;color:var(--muted);font-size:12px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px var(--success-wash);margin-right:2px}
.demo-tag{font-size:11px;font-weight:750;letter-spacing:.4px;background:#eaf2ff;color:#4168a8;border:1px solid #d2e3ff;border-radius:6px;padding:3px 7px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow)}
.panel-title{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:17px}
.panel-title h2{font-size:15px;line-height:1.3;font-weight:750;margin:0 0 5px}
.panel-title p{color:var(--muted);font-size:12px;line-height:1.55;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;min-height:35px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:12px;font-weight:650;transition:background var(--motion),border-color var(--motion),transform var(--motion)}
.btn:hover{background:var(--surface-subtle);border-color:#b9c9e0}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn-danger{color:var(--danger);border-color:#ffcbd1}.btn-danger:hover{background:var(--danger-wash)}
.btn-subtle{background:var(--surface-subtle)}
.btn-sm{min-height:29px;font-size:11px;padding:5px 9px;border-radius:7px}
.btn-icon{padding:5px;min-width:29px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.toolbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;max-width:100%;border-radius:6px;font-size:10.5px;line-height:1.5;font-weight:700;padding:2px 7px;white-space:nowrap}
.pill-blue{background:var(--primary-wash);color:#2264db}.pill-green{background:var(--success-wash);color:#09865f}
.pill-amber{background:var(--warning-wash);color:#b27208}.pill-red{background:var(--danger-wash);color:#cf3d50}
.pill-grey{background:var(--neutral-wash);color:var(--muted)}
.pill-outline{border:1px solid #bfd4ff;background:var(--surface);color:var(--primary)}
.badge-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-height:21px}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:0 0 23px}
.metric{display:flex;gap:14px;align-items:center;min-height:99px;padding:18px 19px}
.metric-icon{display:grid;place-items:center;width:43px;height:43px;border-radius:11px;color:#276beb;background:#eaf2ff}
.metric:nth-child(2) .metric-icon{color:#8a57ea;background:#f3edff}
.metric:nth-child(3) .metric-icon{color:#139eae;background:#e5f8fa}
.metric-label{color:var(--muted);font-size:11px;margin-bottom:6px}
.metric-value{font-weight:780;font-size:17px;line-height:1.3;letter-spacing:-.4px;overflow-wrap:anywhere}
.metric-hint{font-size:10.5px;color:var(--subtle);margin-top:4px}
.section-heading{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:0 0 14px}
.section-heading h2{font-size:15px;margin:0;font-weight:760}.section-heading span{color:var(--muted);font-size:12px}
.accounts-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
.account-card{position:relative;display:flex;flex-direction:column;min-width:0;padding:17px 17px 13px;overflow:hidden;transition:border-color var(--motion),box-shadow var(--motion)}
.account-card:hover{box-shadow:0 7px 30px rgba(31,59,99,.075)}
.account-card.is-next{border-color:#538cf9;box-shadow:0 0 0 1px #d0e2ff,inset 0 0 0 .5px #a3c4ff}
.account-card.is-pinned:not(.is-next){border-color:#b5cffc}
.account-card.is-unavailable{background:linear-gradient(180deg,var(--surface) 75%,var(--surface-subtle));}
.account-top{display:flex;gap:11px;align-items:flex-start;margin-bottom:9px}
.account-avatar{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:#eaf2ff;color:#2563eb}
.account-avatar.green{background:#dff6ef;color:#0a9d73}.account-avatar.orange{background:#fff2df;color:#d68800}
.account-avatar.red{background:#fff0f1;color:#d83c4d}.account-avatar.purple{background:#f0ecff;color:#7c56cf}
.account-id-block{flex:1;min-width:0}
.account-name{font-size:14px;font-weight:760;line-height:1.4;margin:0 0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account-id{font-size:10.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank{background:var(--neutral-wash);font-family:ui-monospace,Consolas,monospace;padding:5px 7px;border-radius:6px;color:var(--muted);font-size:11px;font-weight:700}
.account-card.is-next .rank{background:var(--primary-wash);color:var(--primary)}
.attr-line{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.tech-line{display:flex;gap:11px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:11px}
.tech-line strong{color:var(--ink);font-weight:700}
.account-card .badge-row{margin-bottom:14px}
.quota-row{margin-bottom:12px}
.quota-labels{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:baseline;margin-bottom:6px;font-size:11px}
.quota-labels .qname{font-weight:700}.quota-labels .qpercent{font-weight:800;font-variant-numeric:tabular-nums}
.quota-labels .qreset{color:var(--muted);font-size:10px}
.progress{height:7px;border-radius:99px;background:var(--neutral-wash);overflow:hidden}
.progress>span{display:block;height:100%;border-radius:inherit;background:var(--success);transition:width 300ms ease}
.progress>span.amber{background:var(--warning)}.progress>span.red{background:var(--danger)}.progress>span.missing{background:#cbd3df;width:100%!important;opacity:.55}
.account-meta{margin-top:auto;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:10.7px;line-height:1.55}
.account-notes{margin:9px 0 0;border-left:2px solid #d5e3f8;padding:6px 8px;background:var(--surface-subtle);border-radius:0 6px 6px 0;font-size:10.8px;color:var(--muted);overflow-wrap:anywhere}
.card-actions{display:grid;grid-template-columns:1.05fr 1.2fr .8fr;gap:6px;margin-top:12px}
.card-actions .btn{min-width:0;padding:5px 4px;font-size:10.8px}
.card-actions .btn svg{width:13px;height:13px}
.banner{display:flex;gap:11px;align-items:flex-start;border:1px solid #f1d48c;background:var(--warning-wash);border-radius:11px;padding:13px 15px;margin-bottom:17px;color:#9b670c;font-size:12px}
.banner strong{display:block;font-size:12px;margin-bottom:3px}.banner p{margin:0;line-height:1.6;color:#986f22}.banner.blue{border-color:#cbdffb;background:var(--primary-wash);color:#235bb6}.banner.blue p{color:#4d6eaa}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filter{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 11px;display:inline-flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);font-weight:650}
.filter.is-active{background:var(--primary);color:#fff;border-color:var(--primary)}
.filter .count{background:var(--neutral-wash);padding:1px 6px;border-radius:5px;font-size:10px;color:var(--muted)}
.filter.is-active .count{background:#ffffff3a;color:#fff}
.logs-toolbar{margin-bottom:16px}
.log-table-wrap{overflow:auto;max-width:100%}
.data-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px}
.data-table th{text-align:left;background:var(--surface-subtle);color:var(--muted);font-size:11px;font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line)}
.data-table td{border-bottom:1px solid var(--line);padding:13px 14px;vertical-align:top;color:var(--ink);overflow-wrap:anywhere}
.data-table tbody tr:last-child td{border-bottom:none}.data-table tbody tr:hover{background:var(--surface-subtle)}
.log-event{font-weight:650;font-size:11.5px;color:#2f4668}.data-table .muted-cell{color:var(--muted);font-size:11px}
.data-table .fields{color:var(--muted);font-size:10.5px;line-height:1.8}
.table-footer{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.settings-note{margin-bottom:18px}
.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:16px}
.settings-col{display:grid;align-content:start;gap:16px;min-width:0}
.settings-panel{overflow:hidden}
.group-header{display:flex;gap:11px;align-items:flex-start;padding:17px 19px;border-bottom:1px solid var(--line)}
.group-icon{display:grid;place-items:center;width:33px;height:33px;border-radius:9px;background:var(--primary-wash);color:var(--primary)}
.group-icon.warn{background:var(--warning-wash);color:#c78612}
.group-icon.green{background:var(--success-wash);color:var(--success)}
.group-title{font-size:14px;font-weight:770;margin:0 0 2px}.group-desc{margin:0;color:var(--muted);font-size:11.4px;line-height:1.55}
.setting-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(153px,33%);column-gap:12px;align-items:center;padding:12px 19px;border-bottom:1px solid var(--line);min-height:67px}
.setting-row:last-of-type{border-bottom:none}
.setting-name{font-weight:720;font-size:12px;line-height:1.4;display:block;margin-bottom:4px}
.setting-help{font-size:10.6px;line-height:1.65;color:var(--muted)}
.setting-control{display:flex;justify-content:flex-end;align-items:center;gap:7px;min-width:0}
.setting-row.radio-setting{grid-template-columns:1fr;gap:8px}
.setting-row.radio-setting .setting-control{justify-content:flex-start;flex-wrap:wrap}
.radio-label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:11.5px}
.radio-label input{accent-color:var(--primary);margin:0}
.switch{position:relative;display:inline-flex;align-items:center;justify-content:flex-start;width:38px;height:22px;padding:2px;cursor:pointer;flex:none}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.switch-track{position:relative;display:block;width:38px;height:21px;border-radius:20px;background:#ccd5e2;transition:background var(--motion)}
.switch-track::after{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;background:#fff;border-radius:50%;box-shadow:0 1px 3px #0c1d3330;transition:transform var(--motion)}
.switch input:checked+.switch-track{background:var(--primary)}
.switch input:checked+.switch-track::after{transform:translateX(17px)}
.switch input:focus-visible+.switch-track{outline:3px solid #a8c6ff;outline-offset:2px}
.input,.select,.textarea{width:100%;min-width:0;min-height:34px;background:var(--surface);border:1px solid #ced8e6;border-radius:7px;color:var(--ink);padding:7px 10px;font-size:12px}
.input:focus,.select:focus,.textarea:focus{outline:2px solid #bad2ff;outline-offset:0;border-color:var(--primary)}
.textarea{resize:vertical;min-height:78px}.input.narrow{max-width:90px}
.unit-control{display:flex;width:100%;min-width:0;max-width:214px}
.unit-control input{border-radius:7px 0 0 7px;width:45%;min-width:0}
.unit-control select{border-radius:0 7px 7px 0;border-left:none;width:55%;padding-left:6px}
.settings-footnote{padding:12px 18px;border-top:1px solid #f3d597;background:var(--warning-wash);font-size:11px;color:#93640b}
.settings-savebar{position:relative;bottom:auto;z-index:1;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 17px;margin-top:18px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.dirty-label{font-size:11px;color:var(--muted)}
.dirty-label strong{color:#b47809}
.retry-top{padding:19px;margin-bottom:17px}
.retry-top-inner{display:flex;gap:22px;align-items:flex-start;justify-content:space-between}
.retry-top p{margin:10px 0 0;color:var(--muted);font-size:11.8px;line-height:1.8}
.segmented{display:inline-flex;padding:3px;background:var(--neutral-wash);border-radius:10px;gap:3px}
.segmented button{min-width:68px;border:0;background:transparent;padding:8px 13px;border-radius:8px;color:var(--muted);font-size:12px;font-weight:700}
.segmented button[aria-pressed="true"]{background:var(--primary);color:#fff;box-shadow:0 2px 6px rgba(34,90,207,.18)}
.retry-stack{display:grid;gap:17px}
.content-panel{padding:18px 19px}
.chains{display:grid;gap:12px}
.chain-card{display:grid;grid-template-columns:minmax(148px,.92fr) 26px minmax(0,2.3fr) auto;align-items:start;gap:12px;border:1px solid var(--line);border-radius:11px;background:var(--surface-subtle);padding:13px}
.chain-origin-label{font-size:10.5px;color:var(--muted);margin-bottom:6px;font-weight:700}
.chain-arrow{display:flex;justify-content:center;align-items:center;color:#9aa8ba;padding-top:32px}
.chain-origin .input{font-weight:720}
.target-list{display:grid;gap:7px}
.target-item{display:grid;grid-template-columns:24px minmax(69px,.74fr) minmax(100px,1.3fr) 28px 28px 28px;gap:5px;align-items:center}
.target-index{text-align:center;color:var(--muted);font-size:10px;font-weight:700}
.target-item .input{font-size:11.2px;padding:6px 7px}
.chain-tools{display:flex;flex-direction:column;gap:5px}
.chain-footer{padding-top:9px}
.chain-actions{display:flex;gap:9px;margin-top:15px;flex-wrap:wrap}
.preflight-status{display:flex;gap:11px;align-items:flex-start;background:var(--warning-wash);border:1px solid #f3dfab;border-radius:9px;padding:12px;margin-top:6px;color:#986c10}
.preflight-status.good{background:var(--success-wash);border-color:#c2e9da;color:#087f5b}
.preflight-status strong{font-size:12.5px}.preflight-status p{font-size:11.5px;margin:4px 0 0;line-height:1.55}
.confirmation{margin-top:13px;padding:15px;border-radius:10px;border:1px solid #f1d19b;background:var(--surface-subtle)}
.confirmation h3{margin:0 0 8px;font-size:13px}
.diff-table{width:100%;border-collapse:collapse;font-size:11.5px;margin:8px 0 14px}
.diff-table td,.diff-table th{padding:8px;text-align:left;border-bottom:1px solid var(--line)}
.diff-bad{color:var(--danger);font-weight:750}.diff-good{color:var(--success);font-weight:750}
.advanced{overflow:hidden}
.advanced>summary{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;list-style:none;padding:17px 19px;font-weight:750;font-size:13px}
.advanced>summary::-webkit-details-marker{display:none}
.advanced-summary{color:var(--muted);font-size:11px;font-weight:450;line-height:1.5}
.advanced[open]>summary{border-bottom:1px solid var(--line)}
.advanced-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:7px 5px 5px}
.advanced-grid .setting-row{border:none;grid-template-columns:1fr;gap:7px;min-height:0}
.advanced-grid .setting-control{justify-content:flex-start}
.advanced-grid .setting-control>.input{max-width:220px}
.retry-metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:13px}
.retry-metric{border:1px solid var(--line);border-radius:9px;padding:13px 12px;min-width:0}
.retry-metric .value{font-weight:780;font-size:20px;margin:4px 0 0;line-height:1.25;overflow:hidden;text-overflow:ellipsis}
.retry-metric .caption{font-size:10.5px;color:var(--muted)}
.retry-events{display:grid;gap:8px;margin-top:12px}
.retry-event{display:grid;grid-template-columns:124px 175px 1fr;gap:10px;padding:11px;background:var(--surface-subtle);border:1px solid var(--line);border-radius:8px;font-size:11px}
.empty{padding:45px 20px;text-align:center;color:var(--muted)}
.empty h3{font-size:15px;color:var(--ink);margin:12px 0 5px}.empty p{margin:0;font-size:12px}
.empty-icon{width:45px;height:45px;background:var(--primary-wash);color:var(--primary);border-radius:13px;margin:auto;display:grid;place-items:center}
.not-loaded{height:min(60vh,470px);display:flex;align-items:center;justify-content:center}
.toast-area{position:fixed;top:21px;right:25px;z-index:30;display:grid;gap:9px;max-width:min(410px,calc(100vw - 32px));pointer-events:none}
.toast{display:flex;align-items:flex-start;gap:9px;min-width:260px;padding:12px 14px;box-shadow:var(--shadow-raised);background:var(--surface);border:1px solid #bce5d0;border-left:3px solid var(--success);border-radius:10px;color:var(--ink);font-size:12px;pointer-events:auto;animation:toast-in .2s ease}
.toast.error{border-color:#f9c2ca;border-left-color:var(--danger)}
.toast>div{flex:1}.toast small{color:var(--muted);display:block;margin-top:3px}.toast button{border:0;background:none;color:var(--muted);padding:2px}
@keyframes toast-in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.modal{width:min(600px,calc(100vw - 30px));max-height:calc(100vh - 40px);border:1px solid var(--line);border-radius:15px;padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-raised)}
.modal::backdrop{background:rgba(12,24,42,.62);backdrop-filter:blur(3px)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-header h2{margin:0;font-size:17px}.modal-header small{color:var(--muted)}
.modal-body{padding:19px 22px;overflow:auto;max-height:65vh}
.modal-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-field{display:grid;gap:6px;font-weight:700;font-size:11.5px}
.form-field span{font-weight:400;font-size:10.8px;color:var(--muted)}
.form-field.full{grid-column:1/-1}
.modal-footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
.hidden{display:none!important}
@media(max-width:1399px){.accounts-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.setting-row{grid-template-columns:minmax(0,1fr) minmax(120px,32%)}.settings-grid{grid-template-columns:1fr 1fr}.retry-metrics{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:1130px){.settings-grid{grid-template-columns:1fr}.chain-card{grid-template-columns:1fr 18px 1.8fr auto}.workspace{padding-left:24px;padding-right:24px}.data-table{min-width:800px}}
@media(max-width:859px){
  .app-shell{display:block}.sidebar{position:relative;top:auto;height:auto;padding:12px 14px;background:#142239}
  .brand{padding:2px 4px 10px;border:0}.brand-mark{width:32px;height:32px}.brand-title{font-size:13px}.brand-subtitle{display:none}
  .nav{display:flex;overflow-x:auto;gap:5px;padding:4px 0 10px}.nav-item{flex:none;font-size:11.5px;gap:6px;padding:7px 10px}.nav-item svg{width:14px;height:14px}
  .sidebar-bottom{margin-top:0;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:end;padding:8px 0 0}
  .sidebar-label,.secret-label,.sidebar-running,.sidebar-help{display:none}
  .sidebar-select{grid-column:1;max-width:240px;margin:0;height:32px;font-size:11px}
  .sidebar-input{grid-column:1;height:32px;max-width:240px;font-size:11px}
  .sidebar-primary{grid-column:2;grid-row:1/3;height:32px;font-size:11px}
  .remember{display:flex;grid-column:1/-1;grid-row:3;margin:2px 0;color:#c4d2e5;font-size:10px}
  .sidebar-help{display:flex;grid-column:1/-1;grid-row:4;margin:0;color:#95a8c2;font-size:9px}
  .workspace{padding:20px 16px 30px}.page-header{margin-bottom:16px}.page-header h1{font-size:21px}
  .metrics{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:18px}.metric{padding:12px;min-height:80px;gap:7px}.metric-icon{width:28px;height:28px}.metric-icon svg{width:16px;height:16px}.metric-value{font-size:12.5px}.metric-label{font-size:10px}.metric-hint{font-size:9px}
  .accounts-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
  .settings-grid{grid-template-columns:1fr}.chain-card{grid-template-columns:1fr}.chain-arrow{display:none}.retry-top-inner{display:block}.segmented{margin-top:13px}
}
@media(max-width:620px){.accounts-grid,.metrics{grid-template-columns:1fr}.metrics{gap:9px}.metric{min-height:68px}.page-header{align-items:flex-start}.header-status{font-size:10px}.header-status .demo-tag{display:none}.setting-row{grid-template-columns:1fr;gap:9px}.setting-control{justify-content:flex-start}.retry-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.advanced-grid{grid-template-columns:1fr}.retry-event{grid-template-columns:1fr}.modal-form-grid{grid-template-columns:1fr}.toolbar{align-items:flex-start}.settings-savebar{flex-direction:column;align-items:stretch}.settings-savebar .toolbar-actions{justify-content:flex-end}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

    [arr[ti],arr[j]]=[arr[j],arr[ti]];state.retryDirty=true;renderKeepScroll();return;
  }
  if(action==='load-models'){state.modelListLoaded=true;renderKeepScroll();toast(tr('模型建议列表已载入（模拟 CPA 数据）','Model suggestions loaded (mock CPA data)'));return;}
  if(action==='check-preflight'){state.preflightExpanded=true;renderKeepScroll();return;}
  if(action==='cancel-preflight'){state.preflightExpanded=false;renderKeepScroll();return;}
  if(action==='apply-preflight'){state.preflightExpanded=false;state.preflightFixed=true;renderKeepScroll();toast(tr('演示前置检查已修复','Demo prerequisites updated'));return;}
  if(action==='refresh-retry-events'){renderKeepScroll();toast(tr('运行记录已刷新（演示）','Runtime events refreshed (demo)'));return;}
  if(action==='save-retry'){validateRetry();state.retrySaved=clone(state.retryDraft);state.retryDirty=false;addLog('info','retry.save','保存重试链设置','Saved retry settings','scope=retry');renderKeepScroll();toast(tr('重试链设置已保存（演示）','Retry settings saved (demo)'));return;}
 }catch(error){toast(error.message||tr('操作失败','Operation failed'),'error');}
});
document.addEventListener('input',ev=>{
 const el=ev.target,d=el.dataset;
 if(el.id==='keyInput'){state.key=el.value;if(state.remember)storage.setItem('codex.ui.mockkey',state.key);return;}
 if(d.setting&&el.type!=='checkbox'&&el.type!=='radio'){state.settingsDraft[d.setting]=el.type==='number'?Number(el.value):el.value;state.settingsDirty=true;return;}
 if(d.chainSource!==undefined){const c=state.retryDraft.chains[+d.chainSource];if(c)c.source=el.value;state.retryDirty=true;return;}
 if(d.targetField){const target=state.retryDraft.chains[+d.chainIndex]?.targets[+d.targetIndex];if(target)target[d.targetField]=el.value;state.retryDirty=true;return;}
 if(d.advanced&&el.type!=='checkbox'){state.retryDraft.advanced[d.advanced]=el.type==='number'?Number(el.value):el.value;state.retryDirty=true;return;}
});
document.addEventListener('change',ev=>{
 const el=ev.target,d=el.dataset;
 if(el.id==='language'){state.lang=el.value;storage.setItem('codex.ui.lang',state.lang);renderKeepScroll();return;}
 if(el.id==='rememberKey'){state.remember=el.checked;if(state.remember)storage.setItem('codex.ui.mockkey',state.key);else storage.removeItem('codex.ui.mockkey');renderKeepScroll();return;}
 if(d.setting&&el.type==='checkbox'){
  if(['probe_unconfirmed_roster','managed_disable'].includes(d.setting)&&el.checked&&!window.confirm(tr('此操作存在风险，可能探测过期账号或修改 CPA 认证文件。确认启用？','This option can probe stale accounts or modify CPA auth files. Enable it?'))){el.checked=false;return;}
  state.settingsDraft[d.setting]=el.checked;state.settingsDirty=true;renderKeepScroll();return;
 }
 if(d.setting&&el.type==='radio'){state.settingsDraft[d.setting]=el.value;state.settingsDirty=true;renderKeepScroll();return;}
 if(d.durationValue||d.durationUnit){
  let key=d.durationValue||d.durationUnit;
  let numberEl=document.querySelector(`[data-duration-value="${key}"]`),unitEl=document.querySelector(`[data-duration-unit="${key}"]`);
  try{state.settingsDraft[key]=buildDuration(numberEl.value,unitEl.value);state.settingsDirty=true;
    if(el===unitEl){renderKeepScroll();}
  }catch(error){toast(error.message,'error');}
  return;
 }
 if(d.advanced&&el.type==='checkbox'){state.retryDraft.advanced[d.advanced]=el.checked;state.retryDirty=true;renderKeepScroll();return;}
});
document.getElementById('editDialog').addEventListener('submit',ev=>{
 ev.preventDefault();const f=ev.target,a=state.accounts.find(x=>x.auth_id===f.dataset.id);if(!a)return;
 const data=new FormData(f);const p=Number(data.get('scheduler_priority'));
 if(!Number.isInteger(p)||p<0){toast(tr('插件优先级必须为非负整数','Priority must be a nonnegative integer'),'error');return;}
 a.alias=String(data.get('alias')||'').trim();a.scheduler_priority=p;
 a.group_id=String(data.get('group_id')||'').trim();a.group=String(data.get('group')||'').trim();
 a.tags=String(data.get('tags')||'').split(',').map(x=>x.trim()).filter(Boolean);
 a.notes=String(data.get('notes')||'');a.group_notes=String(data.get('group_notes')||'');
 recalcAccounts();document.getElementById('editDialog').close();renderKeepScroll();toast(tr('账号信息已保存（演示）','Account updated (demo)'));
});
document.getElementById('importFile').addEventListener('change',async ev=>{
 const file=ev.target.files?.[0];if(!file)return;
 try{const data=JSON.parse(await file.text()),source=(data&&typeof data.settings==='object')?data.settings:data;
  if(!source||typeof source!=='object'||Array.isArray(source))throw new Error(tr('JSON 格式不正确','Invalid JSON structure'));
  const keys=new Set(groups.flatMap(g=>g.items.map(x=>x[0])));let count=0;
  for(const [key,value] of Object.entries(source))if(keys.has(key)){state.settingsDraft[key]=value;count++;}
  state.settingsDirty=count>0;renderKeepScroll();toast(tr(`已导入 ${count} 项设置，请检查后保存`,`Imported ${count} settings; review before saving`));
 }catch(error){toast(error.message,'error');}finally{ev.target.value='';}
});

function syncDirtyLabels(){
 const el=document.querySelector('.settings-savebar .dirty-label');if(!el)return;
 if(state.route==='settings'&&state.settingsDirty)el.innerHTML=`<strong>● ${tr('有未保存的设置修改','Unsaved scheduling changes')}</strong> · ${tr('与重试链设置独立保存','Saved independently from retry settings')}`;
 if(state.route==='retry'&&state.retryDirty)el.innerHTML=`<strong>● ${tr('有未保存的重试链修改','Unsaved retry changes')}</strong> · ${tr('与调度设置独立保存','Saved separately from scheduling settings')}`;
}
document.addEventListener('input',syncDirtyLabels);
window.addEventListener('hashchange',()=>{if(!['overview','logs','settings','retry'].includes(location.hash.slice(1)))history.replaceState(null,'','#overview');render();window.scrollTo({top:0,behavior:'instant'});});
if(!['overview','logs','settings','retry'].includes(location.hash.slice(1)))history.replaceState(null,'','#overview');
render();

   - GET /status, /settings, /retry/status + existing v4 mutation endpoints.
   - Reuse exactly the existing authorization header / request shape and the existing
     zh-CN / en translation dictionary. Do not send credentials to a new endpoint.
   - Keep settingsDraft and retryDraft independent and do not overwrite them if dirty.
   - Poll status while loaded; never re-parse a form draft during background refresh.
   This is an interactive, fully offline visual prototype with illustrative data.
